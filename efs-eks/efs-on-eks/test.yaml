apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    deployment.kubernetes.io/revision: "5"
  name: test-app
  namespace: default
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: test-app
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: test-app
    spec:
      containers:
      - env:
        - name: ELASTIC_APM_SERVER_URL
          value:
        - name: ELASTIC_APM_APPLICATION_PACKAGES
          value: 
        - name: ELASTIC_APM_SERVICE_NAME
          value: 
        - name: JAVA_TOOL_OPTIONS
          value: -javaagent:/elastic/apm/agent/elastic-apm-agent-1.28.2.jar
        image: 
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /heartbeat
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 100
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 10
        name: test-app
        ports:
        - containerPort: 8080
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /heartbeat
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 100
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 30
        resources:
          limits:
            cpu: "2"
            memory: 4Gi
          requests:
            cpu: "1"
            memory: 3Gi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /elastic/apm/agent
          name: elastic-apm-agent
        - mountPath: /etc/localtime
          name: tz-asia
        - name: persistent-storage
          mountPath: /test/logs
      dnsPolicy: ClusterFirst
      hostAliases:
      - hostnames:
        - 
        ip: 
      - hostnames:
        - 
        ip: 
      initContainers:
      - command:
        - cp
        - -v
        - /usr/agent/elastic-apm-agent-1.28.2.jar
        - /elastic/apm/agent
        image: elastic-apm-agent:v3
        imagePullPolicy: IfNotPresent
        name: elastic-apm-agent
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /elastic/apm/agent
          name: elastic-apm-agent
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - emptyDir: {}
        name: elastic-apm-agent
      - hostPath:
          path: /usr/share/zoneinfo/Asia/Calcutta
          type: ""
        name: tz-asia
      - name: persistent-storage
        persistentVolumeClaim:
          claimName: efs-claim
