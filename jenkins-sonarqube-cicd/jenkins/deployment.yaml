apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins
  namespace: jenkins
  labels:
    app: jenkins
spec:
  replicas: 1
  strategy:
    type: Recreate # ReadWriteOnce PVC — avoid two pods fighting over JENKINS_HOME
  selector:
    matchLabels:
      app: jenkins
  template:
    metadata:
      labels:
        app: jenkins
    spec:
      serviceAccountName: jenkins
      # Local-demo tradeoff: runs as root so it can read/write the mounted
      # host docker.sock regardless of that socket's group ownership. See
      # the Dockerfile's comment and the README's "Production considerations".
      securityContext:
        runAsUser: 0
      containers:
        - name: jenkins
          # Build this from ./Dockerfile first:
          #   docker build -t shahid9741/jenkins-cicd-demo:latest jenkins/
          #   docker push shahid9741/jenkins-cicd-demo:latest
          image: shahid9741/jenkins-cicd-demo:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: agent
              containerPort: 50000
          env:
            - name: JAVA_OPTS
              value: "-Djenkins.install.runSetupWizard=true"
          volumeMounts:
            - name: jenkins-home
              mountPath: /var/jenkins_home
            - name: docker-sock
              mountPath: /var/run/docker.sock
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: jenkins-home
          persistentVolumeClaim:
            claimName: jenkins-home
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket
