apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarqube
  namespace: sonarqube
  labels:
    app: sonarqube
spec:
  replicas: 1
  strategy:
    type: Recreate # ReadWriteOnce PVC
  selector:
    matchLabels:
      app: sonarqube
  template:
    metadata:
      labels:
        app: sonarqube
    spec:
      # SonarQube bundles Elasticsearch, which refuses to start unless the
      # *node's* vm.max_map_count is raised. This init container sets it on
      # the Minikube node before the main container starts. If your cluster's
      # PodSecurity policy blocks privileged init containers, run
      # `minikube ssh -- sudo sysctl -w vm.max_map_count=262144` by hand
      # instead and delete this initContainer block.
      initContainers:
        - name: sysctl
          image: busybox:1.36
          securityContext:
            privileged: true
          command: ["sh", "-c", "sysctl -w vm.max_map_count=262144"]
      containers:
        - name: sonarqube
          # community/lts-community: embedded H2 database, no separate
          # Postgres to run — fine for this local demo, NOT supported for
          # production use. See the README's "Production considerations".
          image: sonarqube:lts-community
          ports:
            - containerPort: 9000
          env:
            - name: SONAR_ES_BOOTSTRAP_CHECKS_DISABLE
              value: "true"
          volumeMounts:
            - name: sonarqube-data
              mountPath: /opt/sonarqube/data
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          readinessProbe:
            httpGet:
              path: /api/system/status
              port: 9000
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /api/system/status
              port: 9000
            initialDelaySeconds: 90
            periodSeconds: 30
            failureThreshold: 10
      volumes:
        - name: sonarqube-data
          persistentVolumeClaim:
            claimName: sonarqube-data
