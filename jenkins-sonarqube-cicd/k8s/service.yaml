apiVersion: v1
kind: Service
metadata:
  name: cicd-demo
  namespace: cicd-demo
  labels:
    app: cicd-demo
spec:
  type: NodePort
  selector:
    app: cicd-demo
  ports:
    - port: 80
      targetPort: 8080
      # Fixed nodePort so `minikube service` / the README's browser-access
      # step doesn't need to look it up each time.
      nodePort: 30080
