apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql-b
spec:
  serviceName: mysql-b
  replicas: 1
  selector:
    matchLabels:
      app: mysql-b
  template:
    metadata:
      labels:
        app: mysql-b
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          # server-id must be unique across all members of the replication topology
          args:
            - "--server-id=2"
            - "--gtid-mode=ON"
            - "--enforce-gtid-consistency=ON"
          ports:
            - containerPort: 3306
              name: mysql
          envFrom:
            - secretRef:
                name: mysql-b-secret
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$(MYSQL_ROOT_PASSWORD)"]
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$(MYSQL_ROOT_PASSWORD)"]
            initialDelaySeconds: 30
            periodSeconds: 20
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
