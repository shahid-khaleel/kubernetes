apiVersion: v1
kind: ConfigMap
metadata:
  name: config-demo-config
  namespace: configmap-rotations
data:
  application.yaml: |
    server:
      port: 8080

    feature:
      enabled: true

    management:
      endpoint:
        health:
          probes:
            enabled: true
      endpoints:
        web:
          exposure:
            include: health,info
