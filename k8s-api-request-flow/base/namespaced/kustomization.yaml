apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No `namespace:` here -- each overlay decides which namespace these land in.
# Deliberately just the persistent scaffolding (RBAC + policy plumbing).
# Test pods live in ../../fixtures/ and are applied on-demand by the test
# scripts -- they compete for the same ResourceQuota as each other, so they
# can't all be permanently co-resident (see fixtures/README note).
resources:
  - viewer-sa.yaml
  - limitrange.yaml
  - resourcequota.yaml
