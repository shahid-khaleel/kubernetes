---
# Lightweight yamllint config for CI.
#
# Extends the default ruleset but relaxes stylistic rules that these
# hand-written, comment-heavy K8s manifests were never written against
# (line length, leading "---" document markers, comment spacing). Keeps
# the rules that actually catch real mistakes: indentation, key
# duplication, trailing whitespace, and basic syntax.
extends: default

rules:
  document-start: disable
  line-length: disable
  comments: disable
  comments-indentation: disable
  truthy: disable
  # Pure formatting nits (trailing whitespace, blank line at EOF) that
  # don't affect how a manifest is parsed or applied - not worth failing
  # CI over on files we're not allowed to hand-edit for this pass.
  trailing-spaces: disable
  empty-lines: disable
  braces:
    max-spaces-inside: 1
