apiVersion: v1
kind: ServiceAccount
metadata:
  name: s3-app-sa
  namespace: s3-app
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::1234:role/s3-app-irsa-role

--- 

apiVersion: apps/v1
kind: Deployment
metadata:
  name: s3-app
  namespace: s3-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: s3-app
  template:
    metadata:
      labels:
        app: s3-app
    spec:
      serviceAccountName: s3-app-sa
      containers:
        - name: s3-app
          image: 1234.dkr.ecr.ap-south-1.amazonaws.com/s3-test-app:latest
          ports:
            - containerPort: 8080

--- 
apiVersion: v1
kind: Service
metadata:
  name: s3-app
  namespace: s3-app
spec:
  type: NodePort
  selector:
    app: s3-app
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080

